spring.datasource.url=jdbc:mysql://localhost:3306/mediatech_db_v2?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration - Enhanced Security (OWASP A04:2025 externalized secret with local fallback)
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.access-token.expiration=900000
# Access token: 15 minutes (900,000 ms) - Short-lived for security
application.security.jwt.refresh-token.expiration=604800000
# Refresh token: 7 days (604,800,000 ms) - Long-lived but rotated

# Brute-Force Protection Configuration
application.security.max-login-attempts=5
# Maximum failed login attempts before account lockout
application.security.lockout-duration-minutes=30
# Account lockout duration in minutes
application.security.attempt-window-minutes=15
# Time window for counting failed attempts

# Server Configuration
server.port=8090

# Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.estc.mediatech_2=DEBUG

# # Enable Scheduled Tasks (for token cleanup)
spring.task.scheduling.enabled=true       



# Mail Configuration (Example: Mailtrap or Gmail)   ## do not 
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_username
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Configuration (OWASP A02:2025)
management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

# App Info for Actuator
info.app.name=MediaTech_Core_Engine
info.app.version=2.1.0-STABLE

# Strict JSON Deserialization (OWASP A08:2025 - Reject unknown properties / anti Mass-Assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true
